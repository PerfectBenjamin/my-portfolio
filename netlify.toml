[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/"
  to = "/snapshot/index.html"
  status = 200
  force = true

# The snapshot's JS bundle re-inserts the original site's head tags on hydration,
# which request /favicon/* at the site root. Serve the real icon from there.
[[redirects]]
  from = "/favicon/site.webmanifest"
  to = "/snapshot/favicon/site.webmanifest"
  status = 200

[[redirects]]
  from = "/favicon/*"
  to = "/favicon.png"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200
