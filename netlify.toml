[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/"
  to = "/snapshot/index.html"
  status = 200
  force = true

# The snapshot's JS bundle re-inserts the original site's head tags on hydration,
# which request the /favicon/* icon set. Those files are real assets in
# public/favicon, so only the browser's /favicon.ico probe needs mapping.
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon/favicon-32x32.png"
  status = 200
